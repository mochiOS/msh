[package]
id = "org.mochios.msh"
name = "mochi shell"
version = "0.1.0"
vendor = "mochiOS Project"

[[binary]]
path = "/bin/msh"
kind = "application"
requires = [
    "fs.read.all",
    "fs.write.tmp",
    "fs.write.user",
    "ipc.client",
    "ipc.server",
    "net.connect",
    "net.tls.connect",
    "net.http.request",
    "process.spawn",
]
